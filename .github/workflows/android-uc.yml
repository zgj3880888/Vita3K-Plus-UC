name: Build Vita3K+ UC

# CI-only mirror.
#
# The build itself lives in zgj3880888/Vita3K-Plus@uc-build, but GitHub disabled
# Actions for that repository on 2026-11-07 (dispatch and push both answer
# "Actions has been disabled for this repository" while the REST API still
# reports enabled=true). The source repository is still readable, so this
# workflow clones it and runs the same build here.
#
# Keep this file in sync with .github/workflows/android-uc.yml in the source
# repository. Everything below the checkout step is identical.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_REPO: https://github.com/zgj3880888/Vita3K-Plus.git
  SRC_REF: uc-build

jobs:
  android-uc:
    name: Android arm64 coexisting build
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Fetch Vita3K+ source (${{ env.SRC_REF }})
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "$SRC_REPO"
          git fetch --no-tags origin "$SRC_REF"
          git checkout -q -B "$SRC_REF" FETCH_HEAD
          git submodule update --init --recursive --depth 1
          echo "--- head"
          git log --oneline -1
          echo "--- files"
          ls -1 | head -20
          echo "--- version"
          grep -n 'versionName = ' android/app/build.gradle

      - name: Show applied patches
        run: |
          echo "=== applicationId ==="
          grep -n 'applicationId = ' android/app/build.gradle
          echo "=== versionName ==="
          grep -n 'versionName = ' android/app/build.gradle
          echo "=== accurate-thread-scheduling ==="
          grep -n 'accurate-thread-scheduling' vita3k/config/include/config/config.h
          echo "=== high-accuracy ==="
          grep -n '"high-accuracy"' vita3k/config/include/config/config.h
          echo "=== app_name ==="
          grep -n 'name="app_name"' android/app/src/main/res/values/strings.xml

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: cache-android-native-uc-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            cache-android-native-uc-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@v1.2.23
        # ccache only speeds the build up. The runner image has neither ccache
        # nor working ubuntu mirrors, and the action's own install step is what
        # aborted the previous run with `exit code 100` - so a failure here must
        # never stop the APK from being produced.
        continue-on-error: true
        with:
          key: android-uc
          install: false

      - name: Restore pinned signing keystore
        run: |
          set -euo pipefail
          base64 -d ci/uc-signing.b64 > "$RUNNER_TEMP/uc-release.jks"
          ls -la "$RUNNER_TEMP/uc-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/uc-release.jks" \
            -storepass vita3kuc123 -alias vita3kuc | grep -E 'SHA256|Subject' | head -4

      - name: Build Android target (release)
        env:
          SIGNING_STORE_PATH: ${{ runner.temp }}/uc-release.jks
          SIGNING_STORE_PASSWORD: vita3kuc123
          SIGNING_KEY_ALIAS: vita3kuc
          SIGNING_KEY_PASSWORD: vita3kuc123
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/build-android.sh "$GITHUB_WORKSPACE/artifacts/uc"

      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/artifacts/uc/app.apk"
          ls -la "$(dirname "$APK")"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "using $BT"
          "$BT/aapt2" dump badging "$APK" | head -3
          PKG="$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VER="$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          ABIS="$("$BT/aapt2" dump badging "$APK" | sed -n "s/^native-code: //p" | head -1)"
          echo "package   = $PKG"
          echo "version   = $VER"
          echo "native    = $ABIS"
          if [ "$PKG" != "org.vita3kplus.emulator.uc" ]; then
            echo "::error::unexpected applicationId: $PKG — coexistence with stock Vita3K+ is broken"
            exit 1
          fi
          python3 ci/check_signature.py "$APK" || true
          # MT Manager's document provider has to survive the build, otherwise
          # the app stops showing up in MT's file browser without root.
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q MTDataFilesProvider \
            || { echo "::error::the MT document provider is missing from the manifest"; exit 1; }
          unzip -l "$APK" | grep -q "classes2.dex" \
            || { echo "::error::classes2.dex is missing"; exit 1; }
          echo "OK: $PKG installs alongside org.vita3kplus.emulator"

      - name: Assert the signing certificate did not change
        run: |
          set -euo pipefail
          python3 ci/check_signature.py artifacts/uc/app.apk 0112af32118e63044db3585b76137f4288261a0f6e1ce1d4d73d603981bf5301

      - name: Print ccache statistics
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vita3kplus-uc-arm64
          path: artifacts/uc
          if-no-files-found: error
          retention-days: 30
